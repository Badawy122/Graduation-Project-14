<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sawa2tlek – نظام إدارة الحملات التسويقية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- صفحة تسجيل الدخول / إنشاء حساب -->
<div id="auth" class="auth">
<button type="button" class="ib th0" data-a="theme" title="Dark / Light">🌓</button>
<form class="card ab" id="af">
<div class="logo">Sawa2tlek-سوقتلك</div>
<p class="mut">نظام إدارة الحملات التسويقية</p>
<div class="tabs"><button type="button" class="on" data-m="in">Login</button><button type="button" data-m="up">Sign Up</button></div>
<label id="nl" class="hide">الاسم<input name="n" autocomplete="name"></label>
<label>Email<input name="e" type="email" required autocomplete="email" placeholder="name@example.com"></label>
<label>Password<input name="p" type="password" required minlength="6" autocomplete="current-password" placeholder="6 أحرف على الأقل"></label>
<div class="row"><label class="ck"><input type="checkbox" name="r"> Remember me</label><a href="#" id="fp" class="lk">Forgot password?</a></div>
<button class="btn" id="ab">Login</button>
<p id="am" role="status"></p>
<p class="mut sm">نسخة تجريبية: أي إيميل وكلمة مرور صحيحة الشكل تدخّلك.</p>
</form>
</div>

<!-- الهيكل الرئيسي: Sidebar + Top Navigation + Main Content -->
<div id="app" class="app hide">
<aside class="sb" id="sb"></aside>
<div class="main">
<header class="top" id="top"></header>
<main class="content" id="main"></main>
</div>
<div class="ov" id="ov" data-a="menu"></div>
</div>

<script src="script.js"></script>
</body>
</html>
